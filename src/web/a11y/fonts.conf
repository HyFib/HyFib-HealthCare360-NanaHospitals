<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Chromium on a Linux machine picks fonts as on the runner of the CI job "Accessibility in a browser":

    cd src/web && FONTCONFIG_FILE="$PWD/a11y/fonts.conf" pnpm test:a11y

  The runner (ubuntu-latest) has none of the theme's named fonts, so the staff app and the portal are painted in its
  default sans-serif font (system-ui), DejaVu Sans, about as wide as Segoe UI on Windows. A desktop's own fonts and
  preferences (Inter, Noto Sans, Cantarell…) can stand in for those names or for the default, and a screen that fits
  in a narrower font can still overflow its columns in CI. This keeps the machine's configuration, and before its
  rules:
  - asks for the theme's named fonts under a name no font has, so its aliases do not see them and Chromium finds none,
    as on the runner;
  - makes DejaVu Sans the default sans-serif font (fonts-dejavu-core on Debian and Ubuntu).
  Chromium on Windows and macOS does not read fontconfig. docs/architecture/FRONTEND-GUIDE.md, "Accessibility".
-->
<fontconfig>
  <match target="pattern">
    <test qual="first" name="family"><string>Segoe UI Variable Text</string></test>
    <edit name="family" mode="assign_replace"><string>Not on the CI runner</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>Segoe UI</string></test>
    <edit name="family" mode="assign_replace"><string>Not on the CI runner</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>-apple-system</string></test>
    <edit name="family" mode="assign_replace"><string>Not on the CI runner</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>Noto Sans</string></test>
    <edit name="family" mode="assign_replace"><string>Not on the CI runner</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>sans</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>DejaVu Sans</string></edit>
  </match>

  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
</fontconfig>
