# CodeQL code scanning (.github/workflows/codeql.yml). The security-extended suite adds the lower-precision security
# queries to the default ones. Test code and generated files are left out: they never run in a hospital, and alerts in
# them would only be noise. paths-ignore applies only to the TypeScript and workflow analysis: the C# job analyses all
# the code it builds, so it keeps the tests out by building only the shipped projects (see the workflow), and the
# database migrations, compiled into the server, are analysed with it.
name: HC360 code scanning

queries:
  - uses: security-extended

# The alert suppression queries: a "// codeql[<query id>]" comment on the line just before a finding marks it as
# suppressed. Findings are fixed in the code; this is only for one reviewed as a false positive or an accepted risk,
# with the reason beside it (docs/security/SECURITY.md). The workflow queries have no such comments.
packs:
  csharp:
    - codeql/csharp-queries:AlertSuppression.ql
  javascript:
    - codeql/javascript-queries:AlertSuppression.ql

paths-ignore:
  - tests
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/test/**"
  - src/web/apps/staff/src/routeTree.gen.ts
  - src/web/apps/portal/src/routeTree.gen.ts
  - "**/node_modules/**"
  - "**/dist/**"
