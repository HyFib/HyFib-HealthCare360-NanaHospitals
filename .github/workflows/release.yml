name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  package:
    name: Build, test and package
    runs-on: windows-latest
    # Actions are pinned to commits (Dependabot proposes updates): this job can write to the repository's releases.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: src/web/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/web/pnpm-lock.yaml

      - name: Publish HC360 (server, desktop, deployment scripts)
        shell: pwsh
        run: ./deploy/windows/Publish-HC360.ps1 -Configuration Release

      # HC360 Desktop updates itself from the Server Node only with a package HyFib signed (SRS DED-18). The key is the
      # HC360_RELEASE_SIGNING_KEY secret, which the script reads from its environment; without it the release is built
      # unsigned, and the job summary says so. tests/deploy/Test-ReleaseSigning.ps1 tests the script with a throwaway key.
      - name: Sign the HC360 Desktop package
        id: sign
        shell: pwsh
        env:
          HC360_RELEASE_SIGNING_KEY: ${{ secrets.HC360_RELEASE_SIGNING_KEY }}
        run: ./tools/release/Sign-HC360Release.ps1 -ArtifactsDir artifacts

      # Signed, the package must verify with the keys built into this release, as the server and the workstations check
      # it: a key not yet added to ReleaseKeys.cs fails the release instead of shipping a package no workstation takes.
      - name: Check the signature with the release keys HC360 trusts
        if: steps.sign.outputs.signed == 'true'
        shell: pwsh
        env:
          DESKTOP_PACKAGE: ${{ steps.sign.outputs.package }}
        run: |
          & artifacts/server/HyFib.HealthCare360.Server.exe desktop verify --package $env:DESKTOP_PACKAGE
          if ($LASTEXITCODE -ne 0) { throw 'The signed HC360 Desktop package does not verify with the release keys built into this version (ReleaseKeys.cs).' }

      # SRS SEC-11: no release while an advisory is past its patch window, or is reported but not recorded in
      # .github/security-advisories.json (docs/security/SECURITY.md, "Patching security advisories"). The NuGet audit
      # already ran in every restore of the publish; npm's runs here, on the lockfile.
      - name: Check the security patch windows
        shell: pwsh
        run: |
          $nuget = Join-Path $env:RUNNER_TEMP 'nuget-audit.json'
          $npm = Join-Path $env:RUNNER_TEMP 'npm-audit.json'
          dotnet list HyFib.HealthCare360.slnx package --vulnerable --include-transitive --format json --no-restore > $nuget
          Push-Location src/web
          pnpm audit --json > $npm
          Pop-Location
          python .github/scripts/patch_windows.py --nuget $nuget --npm $npm
          if ($LASTEXITCODE -ne 0) { throw 'A security advisory is past its patch window, not recorded, or could not be checked (see above).' }

      # The SBOMs (CycloneDX) of what this release ships, beside the packages and in SHA256SUMS.txt: one per package (the
      # server's with the staff app and portal it serves) and one per web app (.github/scripts/sbom.mjs; the tools at their
      # pinned versions; docs/security/SECURITY.md, "SBOMs").
      - name: Make the SBOMs
        shell: pwsh
        run: |
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { throw 'The CycloneDX .NET tool could not be installed.' }
          npm ci --prefix .github/sbom --ignore-scripts --omit=optional --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'cdxgen could not be installed.' }
          node .github/scripts/sbom.mjs --output artifacts
          if ($LASTEXITCODE -ne 0) { throw 'The SBOMs could not be made.' }
          Get-ChildItem artifacts -Filter '*.cdx.json' | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Add-Content artifacts/SHA256SUMS.txt -Encoding ascii

      - name: Attach packages to the GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            artifacts/*.zip
            artifacts/*.manifest.json
            artifacts/*.manifest.sig
            artifacts/*.cdx.json
            artifacts/SHA256SUMS.txt
