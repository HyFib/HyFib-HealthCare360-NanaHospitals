name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  package:
    name: Build, test and package
    runs-on: windows-latest
    # Actions are pinned to commits (Dependabot proposes updates): this job can write to the repository's releases.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: src/web/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/web/pnpm-lock.yaml

      - name: Publish HC360 (server, desktop, deployment scripts)
        shell: pwsh
        run: ./deploy/windows/Publish-HC360.ps1 -Configuration Release

      - name: Attach packages to the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
