name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  package:
    name: Build, test and package
    runs-on: windows-latest
    # Actions are pinned to commits (Dependabot proposes updates): this job can write to the repository's releases.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: src/web/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/web/pnpm-lock.yaml

      - name: Publish HC360 (server, desktop, deployment scripts)
        shell: pwsh
        run: ./deploy/windows/Publish-HC360.ps1 -Configuration Release

      - name: Attach packages to the GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
