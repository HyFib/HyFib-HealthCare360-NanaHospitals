name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-and-desktop:
    name: Server and desktop (.NET)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore HyFib.HealthCare360.slnx

      - name: Build (warnings are errors)
        run: dotnet build HyFib.HealthCare360.slnx --no-restore -c Release

      - name: Test
        run: dotnet test --solution HyFib.HealthCare360.slnx --no-build -c Release

  web:
    name: Web apps (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: src/web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm -r test

      - name: Build
        run: pnpm -r --filter './apps/**' build
