name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commits (Dependabot proposes updates), and no job keeps the checkout's token, since none pushes.
jobs:
  server-and-desktop:
    name: Server and desktop (.NET)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Whitespace only, from .editorconfig; needs no restore. Fix locally with: dotnet format whitespace . --folder
      - name: Check C# formatting
        run: dotnet format whitespace . --folder --verify-no-changes

      # NuGet audit: a package with a known vulnerability, direct or transitive, fails restore (Directory.Build.props).
      - name: Restore and audit packages
        run: dotnet restore HyFib.HealthCare360.slnx

      # Warnings are errors, and every security analyzer rule is on (Directory.Build.props).
      - name: Build
        run: dotnet build HyFib.HealthCare360.slnx --no-restore -c Release

      # The end-to-end journeys (IntegrationTests) need PostgreSQL. Windows runners cannot run Linux containers, but they
      # come with PostgreSQL installed (service stopped): start it and give the tests a server to create databases on.
      - name: Start PostgreSQL for the end-to-end journeys
        shell: pwsh
        run: |
          $service = Get-Service -Name 'postgresql*' | Select-Object -First 1
          Set-Service -InputObject $service -StartupType Manual
          Start-Service -InputObject $service
          & (Join-Path $env:PGBIN 'pg_isready.exe') -h localhost -p 5432 -t 60
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL did not start.' }
          $user = if ($env:PGUSER) { $env:PGUSER } else { 'postgres' }
          $password = if ($env:PGPASSWORD) { $env:PGPASSWORD } else { 'root' }
          "HC360_TEST_DATABASE=Host=localhost;Port=5432;Username=$user;Password=$password;Database=postgres" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # The HC360 service signs in to PostgreSQL with its Windows account (SSPI) and no password. The installer's own
      # functions set that up here, for the runner's account, so WindowsDatabaseSignInTests can sign in and dump that way.
      - name: Let the runner's Windows account sign in to PostgreSQL (SSPI)
        shell: pwsh
        run: tests/deploy/Enable-TestWindowsSignIn.ps1

      # A hung run fails in half an hour instead of the runner's six.
      - name: Test
        run: dotnet test --solution HyFib.HealthCare360.slnx --no-build -c Release --timeout 30m

  installer:
    name: Server installer (PowerShell 5.1 and 7)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Install-HC360Server.ps1 runs in Windows PowerShell 5.1 (the default on the Server Node) and in PowerShell 7, and
      # must keep the site's settings file across upgrades in both: their JSON cmdlets differ.
      - name: Test the installer's handling of hc360.settings.json
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/deploy/Test-InstallerSettings.ps1
          if ($LASTEXITCODE -ne 0) { throw 'The checks failed in Windows PowerShell 5.1.' }
          pwsh -NoProfile -File tests/deploy/Test-InstallerSettings.ps1
          if ($LASTEXITCODE -ne 0) { throw 'The checks failed in PowerShell 7.' }

      - name: Test the installer's set-up of the database sign-in (pg_hba.conf, pg_ident.conf)
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/deploy/Test-InstallerDatabaseSignIn.ps1
          if ($LASTEXITCODE -ne 0) { throw 'The checks failed in Windows PowerShell 5.1.' }
          pwsh -NoProfile -File tests/deploy/Test-InstallerDatabaseSignIn.ps1
          if ($LASTEXITCODE -ne 0) { throw 'The checks failed in PowerShell 7.' }

  web:
    name: Web apps (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the secret scan reads every commit
          persist-credentials: false

      # The secret scan covers the whole repository (every commit, not only the web apps); it runs here because this job
      # is on Linux. gitleaks comes from its GitHub release and is checked against the release's SHA-256: to update it,
      # change both values below. Accepted findings (fake credentials in tests) are listed in .gitleaks.toml.
      - name: Scan every commit for secrets
        working-directory: .
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --verbose --no-banner .

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: src/web/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/web/pnpm-lock.yaml

      # A package with a known vulnerability, of any severity, fails the job. An advisory reviewed as not applying is
      # listed under auditConfig in pnpm-workspace.yaml, with the reason (see docs/security/SECURITY.md).
      - name: Audit packages
        run: pnpm audit --audit-level low

      - name: Install
        run: pnpm install --frozen-lockfile

      # Fix locally with: pnpm format
      - name: Check formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm -r test

      - name: Build
        run: pnpm -r --filter './apps/**' build
