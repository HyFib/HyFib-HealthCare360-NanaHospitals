name: Load test

# How the server performs at the SRS 7.3 targets, with the load test in tools/HyFib.HealthCare360.LoadTest
# (docs/testing/LOAD-TESTS.md). GitHub's runners are shared machines, nothing like a hospital's Server Node, and the
# load test runs on the same one as the server and PostgreSQL: the figures here are only reported, in the run's
# summary. The job fails when requests fail or the load test itself breaks. The figures that decide go-live come from
# a run against a test Server Node on the hospital's hardware.
on:
  workflow_dispatch:
    inputs:
      patients:
        description: Synthetic patients to add before the run
        default: "100000"
      users:
        description: Virtual users
        default: "75"
      minutes:
        description: Minutes to measure, after a minute of starting users
        default: "5"
  schedule:
    # Mondays at 02:00 IST, so a change that slows the server shows within a week.
    - cron: "30 20 * * 0"
  # A change to the load test itself is tried on a smaller register before it merges.
  pull_request:
    paths:
      - tools/HyFib.HealthCare360.LoadTest/**
      - src/server/Modules/HyFib.HealthCare360.Modules.Patients/Seed/LoadTestPatients.cs
      - src/server/HyFib.HealthCare360.Server/LoadTestCli.cs
      - .github/workflows/load.yml

permissions:
  contents: read

concurrency:
  group: load-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load:
    name: Load test (figures reported, not enforced)
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      PATIENTS: ${{ inputs.patients || (github.event_name == 'schedule' && '100000' || '20000') }}
      USERS: ${{ inputs.users || '75' }}
      MINUTES: ${{ inputs.minutes || (github.event_name == 'schedule' && '5' || '2') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build the server and the load test
        run: |
          dotnet build src/server/HyFib.HealthCare360.Server/HyFib.HealthCare360.Server.csproj -c Release
          dotnet build tools/HyFib.HealthCare360.LoadTest/HyFib.HealthCare360.LoadTest.csproj -c Release

      # Windows runners come with PostgreSQL installed (service stopped), as in ci.yml. The server does not create its
      # database (Install-HC360Server.ps1 -CreateDatabase does): an empty one is made here, as the tests do, and the
      # server's migrations fill it, as the superuser.
      - name: Start PostgreSQL
        shell: pwsh
        run: |
          $service = Get-Service -Name 'postgresql*' | Select-Object -First 1
          Set-Service -InputObject $service -StartupType Manual
          Start-Service -InputObject $service
          & (Join-Path $env:PGBIN 'pg_isready.exe') -h localhost -p 5432 -t 60
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL did not start.' }
          $user = if ($env:PGUSER) { $env:PGUSER } else { 'postgres' }
          if (-not $env:PGPASSWORD) { $env:PGPASSWORD = 'root' }
          & (Join-Path $env:PGBIN 'psql.exe') -h localhost -p 5432 -U $user -d postgres -v ON_ERROR_STOP=1 -q -c "CREATE DATABASE hc360_load ENCODING 'UTF8'"
          if ($LASTEXITCODE -ne 0) { throw 'The database could not be created.' }

      # A test server with demonstration data and its staff accounts, configured through HC360_ variables only. The
      # accounts' password is new for every run.
      - name: Start the HC360 server
        shell: pwsh
        run: |
          $password = 'Load-' + [guid]::NewGuid().ToString('N')
          $data = Join-Path $env:RUNNER_TEMP 'hc360'
          $user = if ($env:PGUSER) { $env:PGUSER } else { 'postgres' }
          $pgPassword = if ($env:PGPASSWORD) { $env:PGPASSWORD } else { 'root' }
          $settings = @{
            'HC360_ConnectionStrings__Hospital' = "Host=localhost;Port=5432;Username=$user;Password=$pgPassword;Database=hc360_load;Maximum Pool Size=200"
            'HC360_HealthCare360__DataDirectory' = $data
            'HC360_HealthCare360__SeedDemoData' = 'true'
            'HC360_HealthCare360__Bootstrap__AdminPassword' = $password
            'HC360_HealthCare360__Bootstrap__RequirePasswordChange' = 'false'
            'HC360_HealthCare360__Security__EnforceMfa' = 'false'
            'HC360_HealthCare360__Network__EnableMdns' = 'false'
            'HC360_HealthCare360__Network__EnableWifiMonitor' = 'false'
            'HC360_HealthCare360__Backup__Enabled' = 'false'
            'HC360_HealthCare360__Backup__BeforeMigrations' = 'false'
          }
          foreach ($name in $settings.Keys) {
            "$name=$($settings[$name])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Set-Item -Path "Env:$name" -Value $settings[$name]
          }
          "::add-mask::$password"
          "HC360_LOADTEST_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "HC360_DATA=$data" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $exe = (Resolve-Path 'src/server/HyFib.HealthCare360.Server/bin/Release/net10.0/HyFib.HealthCare360.Server.exe').Path
          $log = Join-Path $env:RUNNER_TEMP 'hc360-server.log'
          Start-Process -FilePath $exe -RedirectStandardOutput $log -RedirectStandardError "$log.err" -WindowStyle Hidden
          $deadline = (Get-Date).AddMinutes(5)
          do {
            Start-Sleep -Seconds 3
            try { $ready = (Invoke-WebRequest -Uri 'https://localhost:7360/health/ready' -SkipCertificateCheck -TimeoutSec 5).StatusCode -eq 200 } catch { $ready = $false }
          } until ($ready -or (Get-Date) -gt $deadline)
          if (-not $ready) { Get-Content $log, "$log.err" -ErrorAction SilentlyContinue | Select-Object -Last 80; throw 'The server was not ready within 5 minutes.' }

      - name: Add synthetic patients
        shell: pwsh
        run: |
          & 'src/server/HyFib.HealthCare360.Server/bin/Release/net10.0/HyFib.HealthCare360.Server.exe' loadtest patients --count $env:PATIENTS
          if ($LASTEXITCODE -ne 0) { throw "Adding synthetic patients failed (exit code $LASTEXITCODE)." }

      # Accounts that may take every step (registering patients included), shared by the virtual users.
      - name: Run the load test
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'load-test.md'
          & 'tools/HyFib.HealthCare360.LoadTest/bin/Release/net10.0/HyFib.HealthCare360.LoadTest.exe' run `
            --server https://localhost:7360/ --ca (Join-Path $env:HC360_DATA 'certs/hc360-hospital-ca.crt') `
            --accounts frontoffice,hospitaladmin --test-server `
            --users $env:USERS --ramp 1m --duration "$($env:MINUTES)m" --targets report --report $report
          $code = $LASTEXITCODE
          if (Test-Path $report) {
            Get-Content $report | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            "_$env:PATIENTS synthetic patients; GitHub runner: figures for comparison between runs, not the hospital's targets._" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          if ($code -ne 0) { throw "The load test failed (exit code $code)." }

      - name: Show the server's log
        if: failure()
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'hc360-server.log'
          Get-Content $log, "$log.err" -ErrorAction SilentlyContinue | Select-Object -Last 200
