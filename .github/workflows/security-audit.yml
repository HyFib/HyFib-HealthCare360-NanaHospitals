name: Security audit

# CI audits the packages on every change. This runs the same audits on main every week, so an advisory published while
# nobody is changing the code still fails a run. GitHub emails whoever last changed the schedule when a run fails, and
# the log names each vulnerable package and its advisory.
on:
  schedule:
    - cron: "30 0 * * 1" # Mondays 06:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nuget:
    name: NuGet packages
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # A package with a known vulnerability, direct or transitive, fails restore (see Directory.Build.props).
      - name: Restore and audit packages
        run: dotnet restore HyFib.HealthCare360.slnx

  npm:
    name: npm packages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: src/web/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Reads the lockfile; nothing is installed.
      - name: Audit packages
        run: pnpm audit --audit-level low
