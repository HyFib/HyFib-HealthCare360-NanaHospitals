name: CodeQL

# Code scanning with CodeQL: the server, HC360 Desktop and the lab agent (C#), the web apps (TypeScript) and these
# workflows (GitHub Actions). A weekly run on main picks up new queries while nobody changes the code. This is the
# advanced setup, so CodeQL default setup stays off. What to do with a finding is in docs/security/SECURITY.md.
#
# With GitHub Code Security on for the repository, the results go to Security › Code scanning, and its check on a pull
# request fails for a new alert of high or critical severity. While Code Security is off, GitHub refuses the results,
# so they are not uploaded: each job lists its findings in its summary and on the lines they are about, and fails for
# one of high or critical severity (.github/codeql/check-results.ps1). Each run finds out which applies by itself. When
# CodeQL default setup has been turned on as well, GitHub refuses the results of this advanced setup too: the job then
# says so and checks them itself, as while Code Security is off, rather than failing on the refused upload. On a pull
# request, CodeQL reports only findings in the lines it changes; the runs on main and every Monday report all.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "45 0 * * 1" # Mondays 06:15 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
      security-events: write # finds out whether code scanning is on, and uploads the results when it is
    strategy:
      fail-fast: false
      matrix:
        include:
          # HC360 Desktop and the lab agent target Windows, so C# is built on Windows, as in CI.
          - language: csharp
            build-mode: manual
            runner: windows-latest
          - language: javascript-typescript
            build-mode: none
            runner: ubuntu-latest
          - language: actions
            build-mode: none
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Listing the analyses answers 403 while Code Security is off, and 404 when it is on but nothing is uploaded yet.
      - name: Is code scanning on?
        id: scanning
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/code-scanning/analyses?per_page=1"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          try { $status = (Invoke-WebRequest -Uri $uri -Headers $headers -SkipHttpErrorCheck).StatusCode } catch { $status = 0 }
          $on = $status -in 200, 404
          "on=$($on.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $on) {
            $why = if ($status -eq 403) { 'GitHub Code Security is off for this repository' } else { "Could not tell whether code scanning is on (HTTP $status)" }
            Write-Output "::notice title=Results checked in this job::$why, so the results are checked here instead of being uploaded."
          }

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Only what ships: the server (with every module), HC360 Desktop and its updater, and the lab agent. Building the
      # solution would also put the tests in the database, and paths-ignore does not apply to a compiled language.
      - if: matrix.language == 'csharp'
        name: Build
        run: |
          dotnet build src/server/HyFib.HealthCare360.Server/HyFib.HealthCare360.Server.csproj -c Release
          dotnet build src/desktop/HyFib.HealthCare360.Desktop/HyFib.HealthCare360.Desktop.csproj -c Release
          dotnet build src/desktop/HyFib.HealthCare360.DesktopUpdater/HyFib.HealthCare360.DesktopUpdater.csproj -c Release
          dotnet build src/agent/HyFib.HealthCare360.LabAgent/HyFib.HealthCare360.LabAgent.csproj -c Release

      # The upload is a step of its own, so a refused one (default setup on) does not fail the job: the job then checks
      # the results itself below.
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/codeql-results
          upload: never

      - if: steps.scanning.outputs.on == 'true'
        name: Upload the results to code scanning
        id: upload
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/codeql-results
          category: /language:${{ matrix.language }}

      - if: steps.upload.outcome == 'failure'
        name: Say why the results are checked here
        run: >-
          echo "::warning title=Results checked in this job::GitHub refused this workflow's results, most often because
          CodeQL default setup is on as well (Settings › Code security › Code scanning: switch to advanced). They are
          checked here instead."

      - name: Check the results
        shell: pwsh
        env:
          RESULTS: ${{ runner.temp }}/codeql-results
          LANGUAGE: ${{ matrix.language }}
          UPLOADED: ${{ steps.upload.outcome == 'success' }}
        run: ./.github/codeql/check-results.ps1 -SarifDirectory $env:RESULTS -Language $env:LANGUAGE -ReportOnly:($env:UPLOADED -eq 'true')
