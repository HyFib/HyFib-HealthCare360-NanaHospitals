name: Demo site

# Publishes the demo (src/web/demo/README.md) at https://hc360.hyfib.com from Cloudflare: the Worker hc360-demo, with
# static assets only. What it publishes is src/web/demo/site, the built folder verify.mjs checked, as it is, with the
# headers in .github/demo-site/_headers. It runs when either changes on main, and by hand. The Worker, its Custom Domain
# and the deploy token are set up once (src/web/demo/README.md); until the token is in place, a run says what is missing
# and deploys nothing. After a deploy, the live site is checked: each file as committed, each header, and Cloudflare in
# front. Run by hand with "check only", it deploys nothing and checks the live site.
on:
  push:
    branches: [main]
    paths:
      - src/web/demo/site/**
      - .github/demo-site/**
      - .github/scripts/demo-site-check.sh
      - .github/workflows/demo-site.yml
  workflow_dispatch:
    inputs:
      check_only:
        description: "Deploy nothing: only check that https://hc360.hyfib.com serves the committed folder"
        type: boolean
        default: false

permissions:
  contents: read

# One deploy at a time; a newer one waits rather than cancelling one half done.
concurrency:
  group: demo-site
  cancel-in-progress: false

env:
  DOMAIN: hc360.hyfib.com
  SITE: src/web/demo/site
  DEPLOY: .github/demo-site

jobs:
  publish:
    name: Publish the demo
    if: ${{ !inputs.check_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The deploy token is kept in this environment's secrets. With the environment's deployment branches set to main
    # (src/web/demo/README.md), only main's runs can read it.
    environment:
      name: demo-site
      url: https://hc360.hyfib.com
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
    steps:
      - name: Look for the Cloudflare credentials
        id: credentials
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" = true ] && [ "$HAS_ACCOUNT" = true ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          message="Nothing deployed: set the secret CLOUDFLARE_API_TOKEN and the variable CLOUDFLARE_ACCOUNT_ID, as src/web/demo/README.md says, then run this workflow again."
          echo "::warning title=Nothing deployed::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
          echo "ready=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.credentials.outputs.ready == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.credentials.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.DEPLOY }}/package-lock.json

      # Wrangler from .github/demo-site/package-lock.json, at its pinned version; no install script runs.
      - name: Install Wrangler
        if: steps.credentials.outputs.ready == 'true'
        run: npm ci --prefix "$DEPLOY" --ignore-scripts --no-audit --no-fund

      # dist/ is the committed folder and the headers file, which Cloudflare applies and does not serve.
      - name: Deploy
        id: deploy
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          rm -rf "$DEPLOY/dist"
          cp -R "$SITE" "$DEPLOY/dist"
          cp "$DEPLOY/_headers" "$DEPLOY/dist/_headers"
          "$DEPLOY/node_modules/.bin/wrangler" deploy --config "$DEPLOY/wrangler.jsonc" --message "Demo site at $GITHUB_SHA"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

  check:
    name: Check the live site
    needs: publish
    if: ${{ always() && (inputs.check_only || needs.publish.outputs.deployed == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the live site
        run: REPORT="$GITHUB_STEP_SUMMARY" bash .github/scripts/demo-site-check.sh "https://$DOMAIN" "$SITE" "$DEPLOY/_headers"
