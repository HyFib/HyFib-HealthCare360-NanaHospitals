# Secret scan (gitleaks), run by CI over every commit with the default rules. The values below were reviewed and are not
# secrets. A new finding is either a real secret (revoke it at the provider first, then remove it from the history) or,
# once reviewed, a value added here with where it comes from.
title = "HC360 secret scan"

[extend]
useDefault = true

[[allowlists]]
description = "Fixed fake credentials in the tests"
regexes = [
  '''Abcdefghijklmnop_123''',             # src/web/apps/portal/src/app.test.tsx
  '''Rx_token-0123456789ab''',            # src/web/apps/portal/src/app.test.tsx
  '''k3P9xLr0bPz7Kd2Nf5Hs''',             # src/web/apps/portal/src/modules/modules.test.ts
  '''q3W9xLr0bPz7Kd2Nf5Hs8Tv1Yc4Ma6Je''', # tests/HyFib.HealthCare360.Platform.Tests/LoggedPathTests.cs
  '''Zk3_9aB-qR7tLm2xWv5c''',             # tests/Modules/HyFib.HealthCare360.Modules.Clinical.Tests/PrescriptionVerificationLinksTests.cs
  '''test-security-token-0001''',         # tests/HyFib.HealthCare360.Integrations.Tests/Pos/PineLabsPosTerminalTests.cs
  '''auth-token-123''',                   # tests/HyFib.HealthCare360.Integrations.Tests/Sms/TwilioSmsProviderTests.cs
  '''pay_A1B2C3D4E5''',                   # src/web/apps/staff/src/modules/billing/GatewayExceptions.test.tsx (a fake gateway payment id)
  '''rfnd_K1L2M3N4O5''',                  # src/web/apps/staff/src/modules/billing/GatewayExceptions.test.tsx (a fake gateway refund id)
  '''^AB12-CD34-EF56-GH78-JK9M-NP0Q-RS1T-VW2X-YZ3A-B4CD-E5FG-H6JK-M7NP-Q8RS$''', # src/web/apps/staff/src/modules/admin/RecoveryKeyDialog.test.tsx (a made-up backup recovery key)
  '''bm90LWZyb20tdGhpcy1tYWNoaW5l''',      # tests/HyFib.HealthCare360.Platform.Tests/ProtectedSettingsTests.cs (base64 of "not-from-this-machine", a fake DPAPI value)
  '''^AQAAANCMnd8BFdERjHoAwE/Cl\+s[BCD]AAAA$''', # tests/deploy/Test-InstallerSettings.ps1 (fake DPAPI values: only the header a real blob starts with, hence anchored)
  '''^BO1F1ipvlTI0LNB1G4xPbDTpBdZ\+rBuQ/ngHzHO4E1w=$''', # tests/Modules/HyFib.HealthCare360.Modules.Interop.Tests/FideliusTests.cs (a throwaway HIP key pair generated by fidelius-cli 1.2.0 as a test vector)
  '''^B9O5XJL5tKlcDlrPSeozuagQB845o9B0hY7jys281Ws=$''', # tests/Modules/HyFib.HealthCare360.Modules.Interop.Tests/FideliusTests.cs (a throwaway HIU key pair generated by fidelius-cli 1.2.0 as a test vector)
]

[[allowlists]]
description = "Code and documents that only look like keys"
regexes = [
  '''^PBKDF2-SHA512$''', # docs/requirements/SRS.md: the password-hashing algorithm
  '''^ProviderKeys\.''', # Integrations: names of settings keys
  '''^crmKeys\.''',      # staff app: query keys
  '''^pregnancy_12m$''', # staff app: a blood-donor deferral rule
  '''^Control\+''',      # staff app: keyboard shortcuts
  '''^hc360_replicator$''', # deploy/windows and tests/deploy: the name of the standby's replication role
  '''^WPA3-Enterprise$''',  # staff app accessibility fixtures (admin.ts): the name of a Wi-Fi security mode
  '''^X509Certificate2$''', # Integrations' UidaiAuthXml.cs: the .NET certificate type, after a parameter named auth
  '''^Curve25519/32byte$''', # Interop's Abdm/Fidelius.cs: the start of "Curve25519/32byte random key", the parameters ABDM puts beside a key
]
